[tool.ruff]
line-length = 88
target-version = "py313"

exclude = [
  ".venv",
  "venv",
  "build",
  "dist",
  "__pycache__",
  "__pypackages__",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
  "thrember"
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle (PEP8)
  "F",   # pyflakes
  "W",   # warnings
  "I",   # import sorting
  "UP",  # pyupgrade
  "B",   # bugbear
  "SIM", # simplify
  "C4",  # comprehensions
]

ignore = [
  "E501",  # handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------

[tool.mypy]
python_version = "3.13"

ignore_missing_imports = true

check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

no_implicit_optional = true
strict_optional = true

warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

# very strict
# warn_return_any = true
# disallow_any_generics = true
# disallow_subclassing_any = true

exclude = [
  ".venv",
  "venv",
  "build",
  "dist",
  "__pycache__",
  "__pypackages__",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
  "thrember"
]

services:
  land-air-app:
    build: .
    container_name: nerds-land-air
    ports:
      - "8080:8080"
    
    environment:
      - APP_MODE = land_air
      - PORT = 8080
    
    restart: unless-stopped



  sea-app:
    build: .
    container_name: nerds-sea
    ports:
      - "8081:8081"
    
    environment:
      - APP_MODE = sea
      - PORT = 8081
      
    restart: unless-stopped

    



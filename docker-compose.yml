services:
  db:
    image: postgres:18
    container_name: local-postgres
    environment:
      POSTGRES_USER: wildlife_user
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: wildlife_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildlife_user -d wildlife_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    container_name: paas-webapp-container
    ports:
      - "5000:5000"
    environment:
      - DISABLE_SQLALCHEMY_CEXT=1
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
services:

  web:
    build: .
    container_name: nerds
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DISABLE_SQLALCHEMY_CEXT=1
      - GUNICORN_CMD_ARGS=--access-logfile - --access-logformat '%({x-forwarded-for}i)s %(l)s %(u)s %(t)s "%(r)s" %(s)s %(b)s'